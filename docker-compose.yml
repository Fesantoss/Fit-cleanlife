services:

web:
image: php:8.3-apache
container_name: nutrilife_web
ports:
-"8080:80"
volumes:
-./src/var/www/html
depends_on:
-db

db: 
image: mysql:8.0
container_name: nutrilife_db
restart: always
environment:
 MYSQL_ROOT_PASSWORD: nutrilife2501
 MYSQL_DATABASE: nutrilife
ports:
- "3307:3306"
volumes:
 - db_data:/var/lib/mysql

 volumes:
 datas:

